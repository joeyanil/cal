# Move this file to .github/workflows/keep-supabase-awake.yml to activate it.
name: Keep Supabase awake

# Free Supabase projects are paused after about a week with no activity.
# This sends one small request every 3 days so the project stays awake.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL       e.g. https://abcdefgh.supabase.co
#   SUPABASE_ANON_KEY  the project's anon / public key
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send a request to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Add the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets first."
            exit 1
          fi
          code=$(curl -s -o /tmp/response.txt -w "%{http_code}" --max-time 30 \
            "$SUPABASE_URL/rest/v1/holiday_types?select=key&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase answered with HTTP $code"
          # 200 = data returned; 401/403 = the database answered and refused an
          # anonymous read. Either way the project is awake. Anything else
          # (000, 5xx, 540...) means it is paused or unreachable.
          case "$code" in
            200|401|403) echo "Project is awake." ;;
            *) echo "Project may be paused or unreachable:"; cat /tmp/response.txt; exit 1 ;;
          esac
